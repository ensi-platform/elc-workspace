services:
  app:
    image: $WORKSPACE_NAME/$APP_IMAGE
    build:
      context: $TPL_PATH
      args:
        - USER_ID=$USER_ID
        - GROUP_ID=$GROUP_ID
    working_dir: /var/www
    stop_grace_period: 0s
    user: "$USER_ID:$GROUP_ID"
    command: sh -lc "yarn dev --hostname 0.0.0.0"
    hostname: "$APP_NAME.$BASE_DOMAIN"
    environment:
      ADMIN_GUI_BACKEND_SERVICE_HOST: $API_HOST
      ADMIN_GUI_BACKEND_URL: $API_HOST
      SELLER_GUI_FRONTEND_SERVICE_HOST: $API_HOST
      ADMIN_GUI_FRONTEND_SERVICE_HOST: "http://$APP_NAME.$BASE_DOMAIN"
      VIRTUAL_HOST: "$APP_NAME.$BASE_DOMAIN"
      VIRTUAL_PORT: "80"
      HOME: /tmp/home
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "$SVC_PATH:/var/www"
      - "$HOME_PATH:/tmp/home"
    networks:
      - dev
  nginx:
    image: $NGINX_IMAGE
    environment:
      BACKEND_DOMAIN: $API_HOST
    stop_grace_period: 0s
    volumes:
      - "$SVC_PATH:/var/www"
      - "$TPL_PATH/nginx/default.conf.template:/etc/nginx/templates/default.conf.template"
    network_mode: "service:app"
    depends_on:
      - app

networks:
  dev:
    external: true
    name: $NETWORK
