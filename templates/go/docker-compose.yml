services:
  app:
    image: $WORKSPACE_NAME/$APP_IMAGE
    build:
      context: $TPL_PATH/go
      args:
        - BASE_IMAGE=$BASE_IMAGE
        - USER_ID=$USER_ID
        - GROUP_ID=$GROUP_ID
    hostname: "$APP_NAME.$BASE_DOMAIN"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VIRTUAL_HOST: "$APP_NAME.$BASE_DOMAIN"
      VIRTUAL_PORT: "80"
      HOME: /tmp/home
      GOMODCACHE: /tmp/home/go/cache
      GOBIN: /tmp/home/go/bin
    working_dir: /var/www
    volumes:
      - "$SVC_PATH:/var/www"
      - "$HOME_PATH:/tmp/home"
      - "$HOME_PATH/.npm:/.npm"
      - "$HOME_PATH/.config:/.config"
      - "$PACKAGES_PATH:$PACKAGES_PATH"
      - "$WORKSPACE_PATH/services/es/data:/var/data"
    networks:
      - dev

networks:
  dev:
    external: true
    name: $NETWORK

